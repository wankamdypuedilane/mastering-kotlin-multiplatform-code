# ch21-production/gradle.properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Public, non-secret configuration compiled into the app by the
# generateAppConfig task (see build-logic). Never put a secret here:
# anything shipped in a binary can be extracted from it.
app.config.apiBaseUrl=https://api.larkmoor.example/v1
app.config.environment=staging
app.config.requestTimeoutSeconds=15
app.config.supportEmail=help@larkmoor.example
