name: ci
# Every top-level folder with a settings.gradle.kts is a standalone Gradle build.
# Each defines two aggregate tasks in its root build.gradle.kts:
#   ciLinux  - JVM/Android/Desktop/JS/Wasm builds and tests
#   ciMacos  - Kotlin/Native iOS simulator tests (+ framework for iosApp)
# If <project>/iosApp/project.yml exists, the SwiftUI app is generated with XcodeGen
# and built for the iOS simulator.
on:
  push:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      swift: ${{ steps.list.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: list
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          shopt -s nullglob
          # On push, build only the projects touched since the previous push
          # (all of them on manual runs or when the workflow itself changed).
          changed=""
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD | cut -d/ -f1 | sort -u)
            if echo "$changed" | grep -qx '.github'; then changed=""; fi
          fi
          keep() { if [ -z "$changed" ]; then cat; else grep -Fx -f <(echo "$changed") || true; fi; }
          g=(*/settings.gradle.kts); s=(*/Package.swift)
          printf '%s\n' "${g[@]}" | xargs -r -n1 dirname | grep -v '^toolchain-check$' | keep | jq -R . | jq -cs . > g.json
          printf '%s\n' "${s[@]}" | xargs -r -n1 dirname | keep | jq -R . | jq -cs . > s.json
          echo "projects=$(cat g.json)" >> "$GITHUB_OUTPUT"
          echo "swift=$(cat s.json)" >> "$GITHUB_OUTPUT"
  linux:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix: { project: "${{ fromJson(needs.discover.outputs.projects) }}" }
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: "${{ matrix.project }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Pre-install npm packages (retried; GitHub tarball downloads sometimes time out)
        run: |
          for t in kotlinNpmInstall kotlinWasmNpmInstall; do
            ./gradlew help --task "$t" -q >/dev/null 2>&1 || continue
            for i in 1 2 3; do
              ./gradlew "$t" -q && break
              echo "$t attempt $i failed, retrying"; sleep 20
            done
          done
      - run: ./gradlew ciLinux --continue
  macos:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix: { project: "${{ fromJson(needs.discover.outputs.projects) }}" }
    runs-on: macos-latest
    defaults: { run: { working-directory: "${{ matrix.project }}" } }
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 (the version the book was tested with)
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ciMacos --continue
      - name: SwiftUI app
        run: |
          if [ ! -f iosApp/project.yml ]; then echo "no iosApp"; exit 0; fi
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd iosApp && xcodegen generate
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Swift unit tests of the iOS app (if the project has a test target)
        run: |
          if [ ! -f iosApp/project.yml ] || ! grep -q 'iosAppTests' iosApp/project.yml; then echo "no iOS test target"; exit 0; fi
          cd iosApp
          set -o pipefail
          # Pick the first available iPhone simulator of the selected Xcode.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO test | tail -40
  swift:
    # Pure Swift packages (Swift chapter): built and tested with SwiftPM on macOS.
    needs: discover
    if: needs.discover.outputs.swift != '[]'
    strategy:
      fail-fast: false
      matrix: { package: "${{ fromJson(needs.discover.outputs.swift) }}" }
    runs-on: macos-latest
    defaults: { run: { working-directory: "${{ matrix.package }}" } }
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 (the version the book was tested with)
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
      - run: swift --version && swift build && swift test
