name: toolchain-check
on:
  push:
    paths: ["toolchain-check/**", ".github/workflows/toolchain-check.yml"]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: toolchain-check } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :shared:jsNodeTest :shared:wasmJsNodeTest :androidApp:assembleDebug :desktopApp:compileKotlinJvm --continue
  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: toolchain-check } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: xcodebuild -version && swift --version && sw_vers
      - name: Kotlin/Native tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: Build SwiftUI app for the simulator
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
