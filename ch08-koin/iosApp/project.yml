name: iosApp
options:
  bundleIdPrefix: dev.example.packetlabels
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.packetlabels.iosApp
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Compose Multiplatform 1.11+ (and Room 3) publish no iosX64 artifacts and this project
        # declares no iosX64 target: build the simulator app for arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
