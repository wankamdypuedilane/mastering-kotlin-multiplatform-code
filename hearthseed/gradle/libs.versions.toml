# hearthseed/gradle/libs.versions.toml
[versions]
kotlin = "2.4.21"
agp = "9.3.1"
compose = "1.12.2"
material3 = "1.12.0-alpha03"
coroutines = "1.11.0"
serialization = "1.12.0"
ktor = "3.6.1"
koin = "4.2.2"
lifecycle = "2.11.0"
navigation = "2.10.0"
activity = "1.12.4"
room3 = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.13"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-engine-defaults = { module = "io.ktor:ktor-client-engine-defaults", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
sqlite-async = { module = "androidx.sqlite:sqlite-async", version.ref = "sqlite" }


# Gradle plugins, on build-logic's classpath (accessors libs.<name>.gradle.plugin).
[libraries.kotlin-gradle-plugin]
module = "org.jetbrains.kotlin:kotlin-gradle-plugin"
version.ref = "kotlin"

[libraries.compose-compiler-gradle-plugin]
module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin"
version.ref = "kotlin"

[libraries.serialization-gradle-plugin]
module = "org.jetbrains.kotlin:kotlin-serialization"
version.ref = "kotlin"

[libraries.compose-gradle-plugin]
module = "org.jetbrains.compose:compose-gradle-plugin"
version.ref = "compose"

[libraries.android-gradle-plugin]
module = "com.android.tools.build:gradle"
version.ref = "agp"

[libraries.ksp-gradle-plugin]
module = "com.google.devtools.ksp:symbol-processing-gradle-plugin"
version.ref = "ksp"

[libraries.room3-gradle-plugin]
module = "androidx.room3:room3-gradle-plugin"
version.ref = "room3"
