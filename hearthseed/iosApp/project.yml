# hearthseed/iosApp/project.yml (XcodeGen: `xcodegen generate` writes iosApp.xcodeproj)
name: iosApp
options:
  bundleIdPrefix: dev.example.hearthseed
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes: [PrivacyInfo.xcprivacy]
      # Chapter 16: the privacy manifest, copied into the app bundle.
      - path: iosApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Hearthseed
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        # Plain HTTP to http://localhost:8085 (hearthseed-server), development only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.hearthseed.iosApp
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Chapter 16: Swift 6 language mode (strict concurrency checking).
        SWIFT_VERSION: "6.0"
        # Compose Multiplatform 1.11+ (and Room 3) publish no iosX64 artifacts and this project
        # declares no iosX64 target: build the simulator app for arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    # Chapter 16: `xcodebuild test` on scheme iosApp runs iosAppTests.
    scheme:
      testTargets: [iosAppTests]
  iosAppTests:
    # A unit-test bundle hosted by the app: Swift Testing, @testable import.
    type: bundle.unit-test
    platform: iOS
    sources: [iosAppTests]
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The app imports Shared, so @testable import iosApp must find it too.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
