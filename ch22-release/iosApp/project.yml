# ch22-release/iosApp/project.yml
name: iosApp
options:
  bundleIdPrefix: dev.example.hearthseed
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Hearthseed
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.hearthseed.ios
        MARKETING_VERSION: "1.4.2"       # keep equal to release.version
        CURRENT_PROJECT_VERSION: "7"     # raise for every upload
        CODE_SIGN_STYLE: Automatic       # team comes from the command line
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin/Native has no iosX64: simulator builds are arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: >-
          $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
